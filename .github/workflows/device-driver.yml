# This workflow verifies that `src/device.rs` stays in sync with `bq41z50.ddsl`.
# See check.yml for information about concurrency cancellation and workflow triggering behavior,
# which this workflow shares.
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
name: device-driver-pregen-check
jobs:
  device-driver-pregen-check:
    runs-on: ubuntu-latest
    name: device-driver-pregen-check
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Check generated device driver
        uses: tullom/device-driver-pregen-check@v1.0.0
        with:
          source: bq41z50.ddsl
          generated-file: src/device.rs
